name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      - "main"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create Github releases
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '24.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Restore the development heading only after publishing succeeded.
  restore-wip:
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Restore WIP heading on main
        uses: actions/github-script@v7
        with:
          script: |
            const file = { ...context.repo, path: 'README.md' };
            const { data } = await github.rest.repos.getContent({ ...file, ref: 'main' });
            const readme = Buffer.from(data.content, 'base64').toString('utf8');
            if (/^### \*\*WORK IN PROGRESS\*\*[ \t]*\r?$/m.test(readme)) {
              core.info('WIP heading already exists; keeping the current changelog.');
              return;
            }
            const heading = /^## Changelog[ \t]*(?=\r?$)/m;
            if (!heading.test(readme)) {
              throw new Error('README.md has no Changelog heading.');
            }
            const newline = readme.includes('\r\n') ? '\r\n' : '\n';
            const updated = readme.replace(heading, match =>
              match.trimEnd() + newline + newline + '### **WORK IN PROGRESS**' + newline);
            await github.rest.repos.createOrUpdateFileContents({
              ...file,
              branch: 'main',
              sha: data.sha,
              message: 'docs: restore WIP changelog heading [skip ci]',
              content: Buffer.from(updated, 'utf8').toString('base64'),
            });
